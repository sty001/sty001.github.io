<!-- 音乐点歌台：全站悬浮球 + 展开面板（模板层直接显示，不依赖 JS） -->
<button id="music-entry" type="button" title="音乐台 · 网易云音乐" aria-label="音乐台">
  <i class="fas fa-music"></i>
</button>

<div id="music-panel" role="dialog" aria-label="网易云音乐点歌台">
  <div class="music-head">
    <span><i class="fas fa-music"></i>音乐台 · 网易云</span>
    <span class="music-head-btns">
      <button class="music-ico-btn" type="button" id="music-search" title="去网易云搜歌"><i class="fas fa-magnifying-glass"></i></button>
      <button class="music-ico-btn" type="button" id="music-standalone" title="独立播放页（刷新/切页都不中断）"><i class="fas fa-up-right-from-square"></i></button>
      <button class="music-ico-btn" type="button" id="music-min" title="最小化到悬浮球，后台继续播放"><i class="fas fa-minus"></i></button>
      <button class="music-ico-btn music-close" type="button" id="music-stop" title="关闭并停止播放">&times;</button>
    </span>
  </div>

  <div class="music-tabs" role="tablist" aria-label="歌单切换">
    <button class="music-tab active" type="button" role="tab" data-list="3778678">热歌榜</button>
    <button class="music-tab" type="button" role="tab" data-list="3779629">新歌榜</button>
    <button class="music-tab" type="button" role="tab" data-list="19723756">飙升榜</button>
    <button class="music-tab" type="button" role="tab" data-list="2884035">原创榜</button>
  </div>

  <!-- 播放确认条：仅选中榜单，不中断当前播放；点▶才真正切换 -->
  <div class="music-play-bar" id="music-play-bar" hidden>
    <button id="music-play-btn" type="button"><i class="fas fa-play"></i><span id="music-play-label">播放</span></button>
  </div>

  <!-- 播放器：懒加载；最小化不断播，关闭才停止 -->
  <iframe
    id="music-frame"
    frameborder="no"
    border="0"
    marginwidth="0"
    marginheight="0"
    width="100%"
    height="430"
    loading="lazy"
    title="网易云音乐播放器"
    data-src-prefix="https://music.163.com/outchain/player?type=0&id="
    data-src-suffix="&auto=0&height=430&size=small"
  ></iframe>

  <div class="music-tip">♪ 榜单可先试听选择，点歌曲才切换；正在播放的歌曲在列表中高亮，播完自动连播；最小化后后台播放不打扰阅读；站内切换页面音乐不断（浏览器刷新除外，可用独立播放页）</div>
</div>
