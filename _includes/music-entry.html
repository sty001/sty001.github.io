<!-- 主页右上角点歌台（网易云音乐官方外链播放器） -->
<button id="music-entry" type="button" title="点歌台 · 网易云音乐" aria-label="点歌台">
  <i class="fas fa-music"></i>
</button>
<div id="music-panel" role="dialog" aria-label="网易云音乐点歌台">
  <div class="music-head">
    <span><i class="fas fa-music"></i>点歌台 · 网易云音乐</span>
    <button class="music-close" type="button" aria-label="关闭">&times;</button>
  </div>
  <!-- 懒加载：点击打开时才由 JS 赋值 src，避免拖慢主页加载 -->
  <iframe
    frameborder="no"
    border="0"
    marginwidth="0"
    marginheight="0"
    width="100%"
    height="430"
    loading="lazy"
    title="网易云音乐播放器"
    data-src="https://music.163.com/outchain/player?type=0&id=3778678&auto=0&height=430&size=small"
  ></iframe>
</div>
