<!-- 右上角语言切换器（全站） -->
<div id="lang-switcher">
  <button id="lang-btn" type="button" aria-label="切换语言 / Language" title="Language / 语言">
    <i class="fas fa-globe"></i>
  </button>
  <div id="lang-menu" role="menu" aria-label="Language menu">
    <a href="/" data-lang="zh" role="menuitem"><span class="lang-flag">简体中文</span><i class="fas fa-check"></i></a>
    <a href="/en/" data-lang="en" role="menuitem"><span class="lang-flag">English</span><i class="fas fa-check"></i></a>
    <a href="/ja/" data-lang="ja" role="menuitem"><span class="lang-flag">日本語</span><i class="fas fa-check"></i></a>
    <a href="/fr/" data-lang="fr" role="menuitem"><span class="lang-flag">Français</span><i class="fas fa-check"></i></a>
  </div>
</div>
