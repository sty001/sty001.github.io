# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: zh

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Shanghai

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: 陆沉盲瞽 的博客 # the main title

tagline: 软件 · 嵌入式 · 硬件开发 · 工艺 · 汽车电子 · 无人机 · 具身机器人 · 生活分享 # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  个人技术博客：以八大专栏（软件、嵌入式、硬件开发、工艺、汽车电子、无人机、具身机器人、生活分享）为框架，系统沉淀学习笔记、项目复盘与生活记录。

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://sty001.github.io"

github:
  username: sty001 # change to your GitHub username

twitter:
  username: # change to your Twitter username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: 陆沉盲瞽
  email: lcmg.sty@gmail.com # change to your email address
  fediverse_handle: # fill in your fediverse handle. E.g. "@username@domain.com"
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/sty001 # change to your GitHub homepage
    - mailto:lcmg.sty@gmail.com

# Site Verification Settings
webmaster_verifications:
  google: # 填写 Google 站点验证代码
  bing: # 填写 Bing 站点验证代码
  baidu: # 填写百度站点验证代码
  alexa:
  yandex:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: # 填写 Google Analytics ID
  goatcounter:
    id: # 填写 GoatCounter ID
  umami:
    id: # 填写 Umami ID
    domain: # 填写 Umami domain
  matomo:
    id: # 填写 Matomo ID
    domain: # 填写 Matomo domain
  cloudflare:
    id: # 填写 Cloudflare Web Analytics token
  fathom:
    id: # 填写 Fathom Site ID

# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'

# Prefer color scheme setting.
#
# Available options: light — Use the light color scheme / dark — Use the dark color scheme
theme_mode: dark

# The CDN endpoint for media resources.
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.jpg

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image: /assets/img/og-image.svg

# boolean type, the global switch for TOC in posts.
toc: true

actions:
  # Display "Edit this post" action on each post page to encourage contributions.
  edit_post:
    enabled: true # set to true to display the "Edit this post" action.
    url: "https://github.com/sty001/sty001.github.io/edit/main"
    # Use dynamic or static URL for the edit link.
    static_url: false # [ true | false ]

comments:
  # Global switch for the post-comment system.
  provider: giscus
  # Giscus options › https://giscus.app
  giscus:
    repo: sty001/sty001.github.io   # 已设为公开仓库，可承载评论
    repo_id: # TODO: 安装 Giscus GitHub App 后填写（见下方说明）
    category: Announcements
    category_id: # TODO: 安装 Giscus GitHub App 后填写
    mapping: pathname
    strict: "0"
    input_position: bottom
    lang: zh-CN
    reactions_enabled: "1"

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, keep empty means false
    env: # [development | production]

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # The option for PWA offline cache
    deny_paths:
      # - "/example"

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
